# ============================================
# APPLICATION CONFIGURATION
# ============================================
spring.application.name=lifelink-organ-donation

# ============================================
# SERVER CONFIGURATION
# ============================================
server.port=8088
server.servlet.context-path=/api/v1

# ============================================
# MONGODB CONFIGURATION
# ============================================
spring.data.mongodb.uri=mongodb://localhost:27017/lifelink_db
spring.data.mongodb.database=lifelink_db
spring.data.mongodb.auto-index-creation=true

# ============================================
# JWT CONFIGURATION
# ============================================
jwt.secret=lifelink_super_secret_key_change_in_production_minimum_256_bits_required_for_hs256
jwt.expiration=86400000
# 24 hours in milliseconds

# ============================================
# CORS CONFIGURATION
# ============================================
cors.allowed-origins=http://localhost:5173,http://localhost:3000
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

# ============================================
# EMAIL CONFIGURATION (SMTP)
# ============================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Email sender
email.from=noreply@lifelink.org
email.name=LifeLink Support

# ============================================
# FILE UPLOAD CONFIGURATION
# ============================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ============================================
# LOGGING CONFIGURATION
# ============================================
logging.level.root=INFO
logging.level.org.lifelink=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/lifelink.log

# ============================================
# ACTUATOR (HEALTH CHECKS)
# ============================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ============================================
# SWAGGER/OPENAPI CONFIGURATION
# ============================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method

# ============================================
# APPLICATION-SPECIFIC PROPERTIES
# ============================================
app.name=LifeLink
app.version=1.0.0
app.description=Organ Donation Management System

# Admin default credentials (change in production!)
app.admin.email=admin@lifelink.org
app.admin.password=Admin@123

# Pagination defaults
app.pagination.default-page-size=20
app.pagination.max-page-size=100

# ============================================
# SECURITY CONFIGURATION
# ============================================
# BCrypt strength (4-31, default 10)
security.bcrypt.strength=10

# Session timeout (30 minutes)
server.servlet.session.timeout=30m

# ============================================
# PERFORMANCE TUNING
# ============================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# ============================================
# ERROR HANDLING
# ============================================
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=false